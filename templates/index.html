<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><title>高校就业信息辅助预审系统</title></head><body><main><p class="eyebrow">招生就业处 · 本地辅助校验</p><h1>高校就业信息辅助预审系统</h1><p class="lead">基于历史审核数据，对就业信息进行结构化辅助校验。</p><p class="status {{ 'ok' if reference_ready else 'bad' }}">企业参考库：{{ '已加载' if reference_ready else '不可用，请联系维护人员' }}</p><p><a class="button" href="{{ url_for('reference_list') }}">查看可信参考库</a></p><section class="cards">{% for stage,title,desc in [('initial','初审预审','对初审导出的就业数据进行批量辅助校验。'),('final','终审预审','校验结构化数据；协议和 PDF 仍需人工审核。')] %}<form class="card" action="{{ url_for('audit',stage=stage) }}" method="post" enctype="multipart/form-data"><h2>{{ title }}</h2><p>{{ desc }}</p><label>选择 Excel <input name="file" type="file" accept=".xlsx" required {% if not reference_ready %}disabled{% endif %}></label><button {% if not reference_ready %}disabled{% endif %}>选择后自动审核</button></form>{% endfor %}</section></main><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
