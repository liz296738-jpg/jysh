<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><title>{{ title }}</title></head><body><main><a href="{{ url_for('reference_list') }}">← 返回参考库</a><h1>{{ title }}</h1>{% if error %}<p class="status bad">{{ error }}</p>{% endif %}<form class="card form" method="post" action="{{ action_url }}"><label>单位名称<input name="dwmc" required value="{{ record.get('dwmc','') }}"></label><label>统一社会信用代码<input name="dwzzjgdm" required value="{{ record.get('dwzzjgdm','') }}"></label><label>单位性质<select name="dwxz" required><option value="">请选择</option>{% for value in choices[0] %}<option value="{{ value }}" {% if record.get('dwxz') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>单位行业<select name="dwhy" required><option value="">请选择</option>{% for value in choices[1] %}<option value="{{ value }}" {% if record.get('dwhy') == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><button>保存</button><a href="{{ url_for('reference_list') }}">取消</a></form></main></body></html>
